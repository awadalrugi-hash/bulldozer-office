<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتب البلدوزر</title>
<style>
  body { font-family: system-ui, "Segoe UI", Tahoma, sans-serif; margin: 0; min-height: 100vh;
         display: grid; place-items: center; background: #0f172a; color: #e2e8f0; }
  .card { text-align: center; padding: 28px 22px; max-width: 420px; }
  h1 { color: #e2b04a; font-size: 22px; margin: 0 0 10px; }
  p { color: #93a5b5; font-size: 15px; line-height: 1.7; margin: 0; }
</style>
</head>
<body>
<div class="card">
  <h1>جارٍ فتح مكتب البلدوزر…</h1>
  <p id="msg">لحظات.</p>
</div>
<script>
(function () {
  var query = new URLSearchParams(window.location.search);
  var code = query.get('code');
  var state = query.get('state');
  var message = document.getElementById('msg');
  function fail(text) { message.textContent = text; }
  if (query.get('error')) { fail('أُلغي تسجيل الدخول عبر Google. أعد المحاولة من شاشة الدخول.'); return; }
  if (!code) { fail('لم يصل رمز الدخول. أعد المحاولة من شاشة الدخول.'); return; }
  fetch('./office-address.txt', { cache: 'no-store' })
    .then(function (response) { return response.text(); })
    .then(function (text) {
      var target = text.trim().replace(/\/+$/, '');
      if (!target) { throw new Error('empty'); }
      window.location.replace(target + '/api/auth/google/callback?code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state || ''));
    })
    .catch(function () { fail('تعذّر معرفة عنوان المكتب الآن. أعد المحاولة قليلاً.'); });
})();
</script>
</body>
</html>
